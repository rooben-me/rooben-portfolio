version: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: rooben-portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install -g pnpm && pnpm dev"
